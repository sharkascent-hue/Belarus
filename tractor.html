<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tractor for sale | Belarus</title>
<meta name="description" content="Belarus tractor for sale in Ireland: photos, full specification, price and finance.">
<meta name="theme-color" content="#0f2a14">
<link rel="icon" type="image/png" href="tractor-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap">
<style>
/* Layout: a classified-ad listing. Gallery and the facts on the left; on desktop a sticky price-and-contact card on the right;
   on phones a sticky bottom bar with price, Call and Enquire. Same tokens and type as the yard page. */
:root{
  --paper:#fbf8f1; --paper-2:#f1ede1; --ink:#151a15; --ink-soft:#4a544a;
  --green:#2f8f3a; --green-deep:#0f2a14; --gold:#e0a63a; --line:rgba(21,26,21,.12);
  --card:#ffffff; --shadow:0 24px 60px -28px rgba(15,42,20,.45);
  --display:"Anton", "Impact", "Arial Narrow", sans-serif;
  --label:"Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --gutter:clamp(16px, 4vw, 56px); --max:1320px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d110d; --paper-2:#151b15; --ink:#eef0e8; --ink-soft:#a6b0a4;
    --green:#4caf55; --green-deep:#0a1f0e; --gold:#e8b24f; --line:rgba(238,240,232,.12);
    --card:#161c16; --shadow:0 24px 60px -28px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d110d; --paper-2:#151b15; --ink:#eef0e8; --ink-soft:#a6b0a4;
  --green:#4caf55; --green-deep:#0a1f0e; --gold:#e8b24f; --line:rgba(238,240,232,.12);
  --card:#161c16; --shadow:0 24px 60px -28px rgba(0,0,0,.8); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:clip;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 .78rem/1 var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--green)}
.eyebrow::before{content:"";width:24px;height:2px;background:currentColor}

.btn{--bg:var(--green);--fg:#fff;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:1em 1.4em;border:0;border-radius:999px;background:var(--bg);color:var(--fg);font:500 .92rem/1 var(--label);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;overflow:hidden;isolation:isolate;white-space:nowrap}
.btn::before{content:"";position:absolute;inset:0;background:var(--green-deep);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn:hover::before{transform:translateY(0)}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn--gold{--bg:var(--gold);--fg:#1a1608}
.btn--gold::before{background:#fff;opacity:.4}
.btn--ghost{--bg:transparent;--fg:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn--ghost::before{background:var(--paper-2)}
.btn--wa{--bg:#1f8f4e}

/* page transition curtain */
.curtain{position:fixed;inset:0;z-index:100;background:var(--green-deep);display:grid;place-items:center;pointer-events:none;transform-origin:top;animation:lift .8s var(--ease) .1s forwards}
.curtain img{width:120px;animation:fadeout .4s ease forwards}
@keyframes lift{to{transform:scaleY(0)}}
@keyframes fadeout{to{opacity:0;transform:translateY(-20px)}}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding-top:env(safe-area-inset-top,0px)}
.hdr__row{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:48px;height:auto}
.brand__name{font:400 1.45rem/1 var(--display);letter-spacing:.03em}
.brand__tag{display:block;font:500 .56rem/1.4 var(--label);letter-spacing:.24em;opacity:.7}
.back{display:inline-flex;align-items:center;gap:8px;font:500 .8rem/1 var(--label);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:.75em 1.1em;border-radius:999px;background:var(--paper-2);transition:background .3s}
.back:hover{background:var(--line)}
.back svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.back:hover svg{transform:translateX(-3px)}

.crumbs{display:flex;flex-wrap:wrap;gap:8px;padding-block:18px 14px;font:500 .74rem/1.4 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--green)}

/* layout */
.listing{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:clamp(20px,3vw,40px);align-items:start;padding-bottom:80px}
.main{display:grid;gap:clamp(20px,3vw,32px);min-width:0}
.side{position:sticky;top:84px;display:grid;gap:16px}
@media (max-width:960px){.listing{display:flex;flex-direction:column;align-items:stretch}.main,.side{display:contents}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}.o9{order:9}}

/* gallery */
.gal{display:grid;gap:10px}
.gal__stage{position:relative;border-radius:24px;overflow:hidden;background:var(--paper-2);aspect-ratio:4/3}
.gal__track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal__track::-webkit-scrollbar{display:none}
.gal__track figure{flex:0 0 100%;margin:0;scroll-snap-align:center;cursor:zoom-in}
.gal__track img{width:100%;height:100%;object-fit:cover}
.gal__nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#151a15;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .3s var(--ease),opacity .3s}
.gal__nav:hover{transform:translateY(-50%) scale(1.08)}
.gal__nav[disabled]{opacity:0;pointer-events:none}
.gal__nav svg{width:20px;height:20px}
.gal__prev{left:14px}.gal__next{right:14px}
.gal__count{position:absolute;right:14px;bottom:14px;padding:.45em .9em;border-radius:999px;background:rgba(10,20,12,.7);color:#fff;font:500 .78rem/1 var(--label);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.gal__badge{position:absolute;left:14px;top:14px;padding:.5em 1em;border-radius:999px;font:600 .72rem/1 var(--label);letter-spacing:.18em;text-transform:uppercase;background:var(--green);color:#fff}
.gal__badge.used{background:#151a15}
.gal__thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.gal__thumbs button{flex:0 0 clamp(78px,16%,120px);aspect-ratio:4/3;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;opacity:.55;outline:2px solid transparent;outline-offset:-2px;transition:opacity .3s,outline-color .3s}
.gal__thumbs button[aria-current="true"]{opacity:1;outline-color:var(--green)}
.gal__thumbs img{width:100%;height:100%;object-fit:cover}
@media (max-width:600px){.gal__stage{border-radius:18px}.gal__nav{display:none}}

/* blocks */
.block{background:var(--card);border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:0 1px 0 var(--line);display:grid;gap:18px}
.block h2{font-size:clamp(1.6rem,2.6vw,2.1rem)}

/* title card */
.title{display:grid;gap:12px}
.title h1{font-size:clamp(2.4rem,5vw,3.6rem)}
.title__sub{color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:.5em .95em;border-radius:999px;background:var(--paper-2);font:500 .74rem/1 var(--label);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.price{font:400 clamp(2.6rem,5vw,3.4rem)/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.price small{display:block;margin-top:6px;font:500 .74rem/1.4 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.permonth{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--green) 12%,var(--card));font-size:.95rem}
.permonth b{font-variant-numeric:tabular-nums}
.permonth svg{width:22px;height:22px;flex:none;color:var(--green)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn:first-child{grid-column:1/-1}
.seller{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.seller img{width:56px;height:auto}
.seller b{font:400 1.3rem/1 var(--display);letter-spacing:.03em;display:block}
.seller span{font-size:.9rem;color:var(--ink-soft)}
.trustline{display:grid;gap:8px;font-size:.92rem;color:var(--ink-soft)}
.trustline div{display:flex;gap:10px;align-items:center}
.trustline svg{width:18px;height:18px;color:var(--green);flex:none}

/* key details */
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:16px;overflow:hidden}
.keys div{background:var(--card);padding:16px 14px;display:grid;gap:8px;align-content:start}
.keys svg{width:22px;height:22px;color:var(--green)}
.keys small{font:500 .66rem/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.keys b{font:600 1.05rem/1.2 var(--body);font-variant-numeric:tabular-nums}
@media (max-width:640px){.keys{grid-template-columns:repeat(2,minmax(0,1fr))}}

.spec{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.spec th,.spec td{padding:13px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.98rem}
.spec tr:last-child th,.spec tr:last-child td{border-bottom:0}
.spec th{width:42%;font:500 .76rem/1.6 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);padding-right:12px}
.desc{color:var(--ink-soft);max-width:68ch}
.feats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}
.feats li{display:flex;gap:10px;align-items:flex-start}
.feats svg{flex:none;width:20px;height:20px;color:var(--green);margin-top:2px}
@media (max-width:540px){.feats{grid-template-columns:1fr}}

/* finance */
.calc{display:grid;gap:18px}
.calc__lbl{display:flex;justify-content:space-between;gap:10px;font:500 .76rem/1 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.calc__lbl output{font:600 1.1rem/1 var(--body);letter-spacing:0;color:var(--ink);text-transform:none;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--green) var(--p,20%),var(--paper-2) var(--p,20%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:6px solid var(--green);box-shadow:0 4px 14px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--card);border:6px solid var(--green)}
.terms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.terms button{border:1px solid var(--line);background:transparent;border-radius:12px;padding:.75em 0;cursor:pointer;font:600 .95rem/1 var(--body);font-variant-numeric:tabular-nums}
.terms button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.calc__out{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:18px 20px;border-radius:16px;background:var(--green-deep);color:#fbf8f1}
.calc__out small{font:500 .7rem/1.3 var(--label);letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.calc__pm{font:400 clamp(2.2rem,5vw,3rem)/1 var(--display);font-variant-numeric:tabular-nums}
.note{font-size:.82rem;color:var(--ink-soft)}

/* enquiry form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:grid;gap:6px;align-content:start;min-width:0}
.field label{font:500 .72rem/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field textarea{width:100%;padding:.9em 1em;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);transition:border-color .3s,box-shadow .3s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 18%,transparent)}
.field textarea{min-height:110px;resize:vertical}
.field .err{font-size:.8rem;color:#c0392b;min-height:1.1em}
.field.bad input{border-color:#c0392b}
.ok{grid-column:1/-1;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:14px;background:color-mix(in srgb,var(--green) 14%,var(--card))}
.ok svg{flex:none;width:26px;height:26px;color:var(--green)}
@media (max-width:540px){.form{grid-template-columns:1fr}}

/* similar */
.similar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.similar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}.similar a{flex:0 0 78%;scroll-snap-align:start}}
.sim{display:grid;text-decoration:none;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--line);transition:transform .4s var(--ease),box-shadow .4s}
.sim:hover{transform:translateY(-4px);box-shadow:0 1px 0 var(--line),var(--shadow)}
.sim img{aspect-ratio:4/3;object-fit:cover;width:100%;transition:transform 1s var(--ease)}
.sim:hover img{transform:scale(1.06)}
.sim div{padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sim b{font:400 1.3rem/1 var(--display)}
.sim span{font:400 1.2rem/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}
.sim small{display:block;font:500 .68rem/1.5 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

/* mobile sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(0,0,0,.08);transform:translateY(110%);transition:transform .5s var(--ease)}
.bar.is-on{transform:none}
.bar__price{flex:1;min-width:0;font:400 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.bar__price small{display:block;font:500 .62rem/1.4 var(--label);letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
.bar .btn{padding:.9em 1.1em}
@media (max-width:960px){.bar{display:flex}body{padding-bottom:84px}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:rgba(5,10,6,.95);display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.lb.is-open{opacity:1;visibility:visible;transition:opacity .4s}
.lb__top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;color:#fff;font:500 .8rem/1 var(--label);letter-spacing:.14em}
.lb__close{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.lb__track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.lb__track::-webkit-scrollbar{display:none}
.lb__track figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;padding:0 12px}
.lb__track img{max-height:80vh;width:auto;max-width:100%;object-fit:contain;border-radius:10px}
.lb__hint{text-align:center;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.6);font-size:.85rem}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:95;transform:translate(-50%,20px);opacity:0;visibility:hidden;background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:999px;font:500 .82rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase;transition:transform .4s var(--ease),opacity .3s,visibility .4s;max-width:calc(100vw - 32px);text-align:center}
.toast.is-on{transform:translate(-50%,0);opacity:1;visibility:visible}

.missing{padding-block:120px;display:grid;gap:18px;justify-items:start}
.missing h1{font-size:clamp(2.6rem,6vw,4.6rem)}

/* enter animation */
.rise{animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.ftr{background:var(--green-deep);color:#fbf8f1;padding-block:40px;font:500 .78rem/1.5 var(--label);letter-spacing:.14em;text-transform:uppercase}
.ftr .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;opacity:.8}
.ftr a{text-decoration:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="curtain" aria-hidden="true"><img src="tractor-mark.png" alt=""></div>

<header class="hdr">
  <div class="wrap hdr__row">
    <a class="brand" href="index.html" aria-label="Belarus, home">
      <img src="tractor-mark.png" alt="" width="48" height="36">
      <span><span class="brand__name">BELARUS</span><span class="brand__tag">FARM WITH PRIDE</span></span>

    <a class="back" href="index.html#stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      All tractors</a>
  </div>
</header>

<main id="page" class="wrap"></main>

<footer class="ftr">
  <div class="wrap">
    <span>© <span id="yr">2026</span> Belarus · Farm with pride</span>
    <span>Prices exclude VAT · Finance subject to approval</span>
    <a href="index.html">Back to the yard ↑</a>
  </div>
</footer>

<div class="bar" id="bar" hidden></div>

<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photos">
  <div class="lb__top"><span id="lbCount">1 / 1</span>
    <button class="lb__close" id="lbClose" aria-label="Close photos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="lb__track" id="lbTrack"></div>
  <div class="lb__hint">Swipe or use the arrow keys</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="stock.js"></script>
<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
$("#yr").textContent = new Date().getFullYear();

const I = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  hp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6 8v8M12 8v8M18 8v4H6"/></svg>',
  drive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="16" r="4"/><circle cx="17" cy="17" r="3"/><path d="M7 12V6h6l3 5h2"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
  lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V4M6 10l6-6 6 6M5 20h14"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l5 5 9-10"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg>'
};

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("is-on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("is-on"), 2600); }

const id = new URLSearchParams(location.search).get("id");
const t = STOCK.find(x => x.id === id);
const page = $("#page");

if (!t) {
  page.innerHTML = `<section class="missing rise"><span class="eyebrow">Listing not found</span>
    <h1>That tractor has gone.</h1>
    <p style="color:var(--ink-soft);max-width:50ch">It may have been sold or the link is out of date. Have a look at what's in the yard now.</p>
    <a class="btn" href="index.html#stock">See all tractors</a></section>`;
} else {
  render(t);
}

function render(t){
  const used = t.cond === "used";
  const photos = (t.gallery && t.gallery.length ? t.gallery : [t.img]).filter(u => u && !u.startsWith("PENDING"));
  const title = `${t.year} ${t.model}`;
  document.title = `${title} for sale | Belarus`;
  const msg = `Hi, is the ${title} (${eur(t.price)} + VAT) still available?`;
  const waHref = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  const telHref = "tel:" + CONFIG.phone.replace(/[^\d+]/g, "").replace("(0)", "");
  const similar = STOCK.filter(x => x.id !== t.id).sort((a,b) => (a.cat === t.cat ? -1 : 0) - (b.cat === t.cat ? -1 : 0) || Math.abs(a.hp - t.hp) - Math.abs(b.hp - t.hp)).slice(0, 3);

  const keys = [
    [I.cal, "Year", t.year],
    [I.clock, "Hours", t.hours ? t.hours.toLocaleString("en-IE") : "0 (new)"],
    [I.hp, "Power", t.hp + " hp"],
    [I.tag, "Condition", used ? "Used" : "New"],
    [I.gear, "Gearbox", t.gearbox],
    [I.drive, "Drive", t.drive],
    [I.lift, "Rear lift", t.lift],
    [I.pin, "Location", "At our yard"]
  ];
  const specs = [
    ["Make", "Belarus"], ["Model", t.model.replace("Belarus ", "")], ["Year", t.year], ["Condition", used ? "Used" : "New"],
    ["Hours", t.hours ? t.hours.toLocaleString("en-IE") : "0"], ["Engine", t.engine], ["Power", t.hp + " hp"], ["Fuel", "Diesel"],
    ["Gearbox", t.gearbox], ["Drive", t.drive], ["PTO", t.pto], ["Hydraulics", t.hydraulics],
    ["Rear lift capacity", t.lift], ["Cab", t.cab], ["Tyres", t.tyres], ["Price", eur(t.price) + " + VAT"]
  ].filter(r => r[1] !== undefined && r[1] !== "");

  page.innerHTML = `
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="index.html#stock">Tractors</a><span>/</span><span aria-current="page">${esc(t.model)}</span></nav>
  <div class="listing">
    <div class="main">
      <section class="gal rise o1" aria-label="Photos">
        <div class="gal__stage">
          <div class="gal__track" id="galTrack">${photos.map((u,i) => `<figure><img src="${u}" alt="${esc(t.model)}, photo ${i+1} of ${photos.length}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async"></figure>`).join("")}</div>
          <span class="gal__badge ${used ? "used" : ""}">${used ? "Used" : "New"}</span>
          <button class="gal__nav gal__prev" id="galPrev" aria-label="Previous photo">${I.left}</button>
          <button class="gal__nav gal__next" id="galNext" aria-label="Next photo">${I.right}</button>
          <span class="gal__count" id="galCount">1 / ${photos.length}</span>
        </div>
        ${photos.length > 1 ? `<div class="gal__thumbs" id="galThumbs">${photos.map((u,i) => `<button type="button" aria-label="Show photo ${i+1}" aria-current="${i===0}"><img src="${u}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      </section>

      <section class="block rise o3" style="animation-delay:.08s" aria-labelledby="keyTitle">
        <h2 id="keyTitle">Key details</h2>
        <div class="keys">${keys.map(([ic, k, v]) => `<div>${ic}<small>${k}</small><b>${esc(v)}</b></div>`).join("")}</div>
      </section>

      <section class="block rise o4" style="animation-delay:.12s" aria-labelledby="descTitle">
        <h2 id="descTitle">Description</h2>
        <p class="desc">${esc(t.description || t.use)}</p>
        ${t.features && t.features.length ? `<ul class="feats">${t.features.map(f => `<li>${I.check}<span>${esc(f)}</span></li>`).join("")}</ul>` : ""}
      </section>

      <section class="block o5" aria-labelledby="specTitle">
        <h2 id="specTitle">Full specification</h2>
        <table class="spec"><tbody>${specs.map(([k,v]) => `<tr><th scope="row">${k}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>
      </section>

      <section class="block o6" aria-labelledby="finTitle">
        <h2 id="finTitle">Finance this tractor</h2>
        <div class="calc">
          <div class="calc__lbl"><label for="dep">Deposit or trade-in</label><output id="depOut" for="dep"></output></div>
          <input type="range" id="dep" min="0" max="${Math.round(t.price*.6/500)*500}" step="500" value="${Math.round(t.price*.2/500)*500}">
          <div class="calc__lbl"><span id="termLbl">Term (months)</span></div>
          <div class="terms" role="group" aria-labelledby="termLbl">${[12,24,36,48,60].map(m => `<button type="button" data-term="${m}" aria-pressed="${m===60}">${m}</button>`).join("")}</div>
          <div class="calc__out"><div><small>Estimated monthly</small><div class="calc__pm" id="pm"></div></div><div style="text-align:right"><small>Amount financed</small><div id="finAmt" style="font-weight:600;font-variant-numeric:tabular-nums"></div></div></div>
          <p class="note">Illustration only, at an example rate of ${CONFIG.apr}% APR, excluding VAT. Not an offer of credit. Finance is subject to status and lender approval.</p>
        </div>
      </section>

      <section class="block o7" id="enquire" aria-labelledby="enqTitle" style="scroll-margin-top:84px">
        <h2 id="enqTitle">Ask about this tractor</h2>
        <form class="form" id="enqForm" novalidate>
          <div class="field"><label for="eName">Your name</label><input id="eName" autocomplete="name"><span class="err"></span></div>
          <div class="field"><label for="ePhone">Phone</label><input id="ePhone" type="tel" autocomplete="tel" placeholder="08X XXX XXXX"><span class="err"></span></div>
          <div class="field full"><label for="eMsg">Message</label><textarea id="eMsg">${esc(msg)}</textarea></div>
          <div class="full" style="display:flex;flex-wrap:wrap;gap:10px">
            <button class="btn" type="submit">${I.mail} Send enquiry</button>
            <a class="btn btn--wa" href="${waHref}" target="_blank" rel="noopener">${I.wa} WhatsApp us</a>
          </div>
          <div class="ok" id="enqOk" hidden role="status">${I.check}<div><b>Thanks, your enquiry is in.</b><br>We'll ring you back about the ${esc(t.model)} within one working day.</div></div>
        </form>
      </section>

      <section class="o9" aria-labelledby="simTitle" style="display:grid;gap:16px">
        <h2 id="simTitle" style="font-size:clamp(1.8rem,3vw,2.4rem)">You might also like</h2>
        <div class="similar">${similar.map(s => `<a class="sim" href="${listingUrl(s)}"><img src="${s.img}" alt="${esc(s.model)}" loading="lazy"><div><span style="color:inherit"><b>${esc(s.model.replace("Belarus ",""))}</b><small>${s.year} · ${s.hp} hp · ${s.cond === "used" ? s.hours.toLocaleString("en-IE") + " hrs" : "New"}</small></span><span>${eur(s.price)}</span></div></a>`).join("")}</div>
      </section>
    </div>

    <aside class="side">
      <div class="block title rise o2" style="animation-delay:.05s">
        <span class="eyebrow">${used ? "Used" : "New"} · ${t.year}</span>
        <h1>${esc(t.model)}</h1>
        <p class="title__sub">${esc(t.use)}</p>
        <div class="chips"><span>${t.hp} hp</span><span>${t.hours ? t.hours.toLocaleString("en-IE") + " hrs" : "0 hrs"}</span><span>${esc(t.drive)}</span><span>${esc(t.gearbox.split(" ").slice(0,3).join(" "))}</span></div>
        <div class="price">${eur(t.price)}<small>Plus VAT</small></div>
        <div class="permonth">${I.tag}<span>From <b>${eur(monthly(t.price*.8, 60))} a month</b> with 20% down over 60 months</span></div>
        <div class="actions">
          <a class="btn btn--gold" href="${telHref}">${I.phone} Call ${esc(CONFIG.phone)}</a>
          <a class="btn btn--wa" href="${waHref}" target="_blank" rel="noopener">${I.wa} WhatsApp</a>
          <a class="btn btn--ghost" href="#enquire" id="enqJump">${I.mail} Enquire</a>
        </div>
      </div>
      <div class="block rise o8" style="animation-delay:.12s">
        <div class="seller"><img src="tractor-mark.png" alt=""><div><b>BELARUS</b><span>${esc(CONFIG.address)}</span></div></div>
        <div class="trustline">
          <div>${I.shield}${used ? "Inspected before sale, with warranty" : "Full manufacturer warranty"}</div>
          <div>${I.truck}Delivery anywhere in Ireland</div>
          <div>${I.swap}Trade-ins welcome</div>
        </div>
        <button class="btn btn--ghost" type="button" id="share">Share this tractor</button>
      </div>
    </aside>
  </div>`;

  $("#lbTrack").innerHTML = photos.map((u,i) => `<figure><img src="${u}" alt="${esc(t.model)}, photo ${i+1}" loading="lazy"></figure>`).join("");

  const bar = $("#bar");
  bar.innerHTML = `<div class="bar__price">${eur(t.price)}<small>+ VAT · ${esc(t.model.replace("Belarus ",""))}</small></div>
    <a class="btn btn--gold" href="${telHref}" aria-label="Call">${I.phone} Call</a>
    <a class="btn" href="#enquire">Enquire</a>`;
  bar.hidden = false;

  initGallery(photos.length);
  initFinance(t);
  initForm();
  initBar();
  $("#share").addEventListener("click", async () => {
    const data = { title: `${title} for sale`, text: msg, url: location.href };
    try { if (navigator.share) { await navigator.share(data); return; } } catch(e) { return; }
    try { await navigator.clipboard.writeText(location.href); toast("Link copied"); } catch(e) { toast("Copy the link from your address bar"); }
  });
  $$('a[href="#enquire"]').forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); $("#enquire").scrollIntoView({ behavior: reduced ? "auto" : "smooth" });
    setTimeout(() => $("#eName").focus({ preventScroll:true }), 500);
  }));
}

function initGallery(n){
  const track = $("#galTrack"), thumbs = $$("#galThumbs button"), prev = $("#galPrev"), next = $("#galNext");
  let idx = 0;
  const go = i => { idx = Math.max(0, Math.min(n - 1, i)); track.scrollTo({ left: idx * track.clientWidth, behavior: reduced ? "auto" : "smooth" }); };
  const sync = () => {
    idx = Math.round(track.scrollLeft / track.clientWidth);
    $("#galCount").textContent = `${idx + 1} / ${n}`;
    thumbs.forEach((b, k) => b.setAttribute("aria-current", k === idx));
    prev.disabled = idx === 0; next.disabled = idx === n - 1;
  };
  track.addEventListener("scroll", () => requestAnimationFrame(sync), { passive:true });
  prev.addEventListener("click", () => go(idx - 1));
  next.addEventListener("click", () => go(idx + 1));
  thumbs.forEach((b, k) => b.addEventListener("click", () => go(k)));
  sync();
  if (n < 2) { prev.hidden = next.hidden = true; }

  // lightbox
  const lb = $("#lb"), lbTrack = $("#lbTrack");
  const lbSync = () => { $("#lbCount").textContent = `${Math.round(lbTrack.scrollLeft / lbTrack.clientWidth) + 1} / ${n}`; };
  lbTrack.addEventListener("scroll", () => requestAnimationFrame(lbSync), { passive:true });
  const open = i => {
    lb.classList.add("is-open"); lb.setAttribute("aria-hidden", "false"); document.documentElement.style.overflow = "hidden";
    requestAnimationFrame(() => { lbTrack.scrollLeft = i * lbTrack.clientWidth; lbSync(); });
    $("#lbClose").focus();
  };
  const close = () => { lb.classList.remove("is-open"); lb.setAttribute("aria-hidden", "true"); document.documentElement.style.overflow = ""; go(Math.round(lbTrack.scrollLeft / lbTrack.clientWidth)); };
  $$("#galTrack figure").forEach((f, k) => f.addEventListener("click", () => open(k)));
  $("#lbClose").addEventListener("click", close);
  lb.addEventListener("click", e => { if (e.target === lb || e.target.tagName === "FIGURE") close(); });
  addEventListener("keydown", e => {
    if (lb.classList.contains("is-open")) {
      if (e.key === "Escape") close();
      if (e.key === "ArrowRight") lbTrack.scrollBy({ left: lbTrack.clientWidth, behavior:"smooth" });
      if (e.key === "ArrowLeft") lbTrack.scrollBy({ left: -lbTrack.clientWidth, behavior:"smooth" });
    } else if (document.activeElement && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      if (e.key === "ArrowRight") go(idx + 1);
      if (e.key === "ArrowLeft") go(idx - 1);
    }
  });
  addEventListener("resize", () => go(idx));
}

function initFinance(t){
  const dep = $("#dep"); let term = 60;
  const calc = () => {
    const fin = t.price - +dep.value;
    dep.style.setProperty("--p", (dep.value / dep.max * 100) + "%");
    $("#depOut").textContent = eur(+dep.value);
    $("#finAmt").textContent = eur(fin);
    $("#pm").textContent = eur(monthly(fin, term));
  };
  dep.addEventListener("input", calc);
  $$("[data-term]").forEach(b => b.addEventListener("click", () => { term = +b.dataset.term; $$("[data-term]").forEach(x => x.setAttribute("aria-pressed", x === b)); calc(); }));
  calc();
}

function initForm(){
  $("#enqForm").addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target; let ok = true;
    $$(".field", f).forEach(fl => { fl.classList.remove("bad"); const er = $(".err", fl); if (er) er.textContent = ""; });
    const fail = (id, m) => { ok = false; const fl = $("#" + id).parentElement; fl.classList.add("bad"); $(".err", fl).textContent = m; };
    if (!$("#eName").value.trim()) fail("eName", "Enter your name");
    const ph = $("#ePhone").value.replace(/[^\d+]/g, "");
    if (!ph) fail("ePhone", "Enter a phone number we can ring"); else if (ph.length < 9) fail("ePhone", "That number looks too short");
    if (!ok) { const first = $(".field.bad input", f); if (first) first.focus(); return; }
    // TODO: send to your email or CRM (e.g. Formspree) here.
    $("#enqOk").hidden = false;
    $$("input,textarea,button[type=submit]", f).forEach(x => x.disabled = true);
  });
}

function initBar(){
  const bar = $("#bar"), title = $(".title");
  if (!title) return;
  new IntersectionObserver(([en]) => bar.classList.toggle("is-on", !en.isIntersecting && en.boundingClientRect.top < 0)).observe(title);
}
</script>
</body>
